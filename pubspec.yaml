name: moe_flutter_chat
description: "Chat package for MOE Flutter ecosystem - modular buyer-seller and group chat"
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.7.0
  web_socket_channel: ^2.4.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  moe_flutter_core:
    git:
      url: https://github.com/mindofemanizer/MOE-Flutter-Core.git
      ref: v1.0.0
  moe_flutter_auth:
    git:
      url: https://github.com/mindofemanizer/MOE-Flutter-Auth.git
      ref: v1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4
